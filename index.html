<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vagabond Tiger</title>
<style>
:root{--bg:#050505;--fg:#f6f6f6;--muted:#999;--line:#242424;--max:900px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;line-height:1.4}
.wrap{width:min(calc(100% - 32px),var(--max));margin:auto}

.hero{padding:14px 0 14px;text-align:center}
.wordmark{display:block;width:min(100%,660px);margin:auto}
.intro{max-width:660px;margin:5px auto 0;color:#d2d2d2;font-size:.94rem}

.members{padding:8px 0 24px}
.members-grid{display:grid;grid-template-columns:repeat(3,190px);justify-content:center;gap:18px}
.member{margin:0;text-align:center}
.portrait{width:190px;aspect-ratio:4/5;overflow:hidden;border-radius:10px;background:#111}
.portrait img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
.member figcaption{margin-top:6px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem}

.release{border-top:1px solid var(--line);padding:20px 0 24px}
.release-grid{display:grid;grid-template-columns:210px 1fr;max-width:560px;margin:auto;gap:26px;align-items:center}
.release-art{width:210px;display:block;border-radius:10px}
.eyebrow{margin:0 0 5px;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h1{margin:0;font-size:2.05rem;line-height:1;letter-spacing:-.035em;text-transform:uppercase}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.btn{min-height:40px;padding:0 19px;border:1px solid #fff;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.btn.primary{background:#fff;color:#000}

footer{border-top:1px solid var(--line);padding:15px 0 20px;color:#707070;font-size:.72rem}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media(max-width:700px){
  .wrap{width:min(calc(100% - 20px),var(--max))}
  .hero{padding:10px 0 14px}
  .wordmark{width:min(100%,560px)}
  .intro{font-size:.88rem;max-width:520px}
  .members{padding:6px 0 20px}
  .members-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .portrait{width:100%;border-radius:8px}
  .member figcaption{font-size:.64rem;letter-spacing:.06em;margin-top:5px}
  .release{padding:18px 0 22px}
  .release-grid{grid-template-columns:minmax(110px,38%) 1fr;gap:15px;max-width:500px}
  .release-art{width:100%;border-radius:8px}
  h1{font-size:clamp(1.65rem,7vw,2.2rem)}
  .eyebrow{font-size:.62rem}
  .actions{margin-top:13px;gap:7px}
  .btn{min-height:36px;padding:0 13px;font-size:.68rem}
}

@media(max-width:430px){
  .members-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .member figcaption{font-size:.58rem}
  .release-grid{grid-template-columns:1fr;gap:14px}
  .release-art{width:min(58vw,205px);margin:auto}
  .release-grid>div{text-align:center}
  .actions{justify-content:center}
  h1{font-size:2rem}
}
</style>
</head>
<body>
<main>
<section class="hero"><div class="wrap">
<img class="wordmark" src="assets/banner.png" alt="Vagabond Tiger">
<p class="intro">Vagabond Tiger is a music collective created by singer-songwriter and producer Michael Prince</p>
</div></section>
<section class="members" aria-label="Vagabond Tiger members"><div class="wrap members-grid">
<figure class="member"><div class="portrait"><img src="mick(1).webp" alt="Mick"></div><figcaption>Mick</figcaption></figure>
<figure class="member"><div class="portrait"><img src="ramona(1).webp" alt="Ramona"></div><figcaption>Ramona</figcaption></figure>
<figure class="member"><div class="portrait"><img src="mister-e(1).webp" alt="Mister E"></div><figcaption>Mister E</figcaption></figure>
</div></section>
<section class="release"><div class="wrap release-grid">
<img class="release-art" src="assets/hey-you.png" alt="Hey You — Vagabond Tiger">
<div><p class="eyebrow">Latest Release</p><h1>Hey You</h1>
<div class="actions"><a class="btn primary" href="https://www.youtube.com/watch?v=1sGNYVrHPbE">Watch</a><a class="btn" href="https://distrokid.com/hyperfollow/vagabondtiger/hey-you-2">Listen</a></div>
</div>
</div></section>
</main>
<footer><div class="wrap foot"><span>© 2026 Vagabond Tiger</span><span>YouTube · Contact</span></div></footer>
</body></html>
